openapi: 3.1.0
info:
  title: Transaction Ledger API
  version: 1.0.0
  description: Assessment API for account balances and immutable credit/debit transactions.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /accounts:
    post:
      operationId: createAccount
      summary: Create a zero-balance account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /accounts/{accountId}/balance:
    get:
      operationId: getAccountBalance
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                type: object
                required: [account_id, balance]
                properties:
                  account_id: { type: string, format: uuid }
                  balance: { $ref: '#/components/schemas/Money' }
        '404': { $ref: '#/components/responses/NotFound' }
  /accounts/{accountId}/transactions:
    post:
      operationId: createTransaction
      summary: Create an immutable credit or debit with scoped idempotency
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, amount, description, reference_id]
              properties:
                type: { type: string, enum: [credit, debit] }
                amount: { $ref: '#/components/schemas/Money' }
                description: { type: string, minLength: 1, maxLength: 500 }
                reference_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResult' }
        '200':
          description: Duplicate reference; existing transaction returned without another balance change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DomainError' }
    get:
      operationId: listTransactions
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: type
          in: query
          schema: { type: string, enum: [credit, debit] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Latest-first transaction history
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /transfers:
    post:
      operationId: createTransfer
      summary: Optional bonus endpoint; atomically transfers funds between accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_account_id, destination_account_id, amount, description, reference_id]
              properties:
                source_account_id: { type: string, format: uuid }
                destination_account_id: { type: string, format: uuid }
                amount: { $ref: '#/components/schemas/Money' }
                description: { type: string, minLength: 1, maxLength: 500 }
                reference_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '201':
          description: Transfer created atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResult' }
        '200':
          description: Duplicate transfer reference; existing transfer returned without moving money again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DomainError' }
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Money:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$'
      examples: ['0.00', '125.50']
    Account:
      type: object
      required: [id, name, balance, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        balance: { $ref: '#/components/schemas/Money' }
        created_at: { type: string, format: date-time }
    Transaction:
      type: object
      required: [id, account_id, type, amount, description, reference_id, created_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        type: { type: string, enum: [credit, debit] }
        amount: { $ref: '#/components/schemas/Money' }
        description: { type: string }
        reference_id: { type: string }
        created_at: { type: string, format: date-time }
    TransactionResult:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required: [duplicate]
          properties:
            duplicate: { type: boolean }
    TransferResult:
      type: object
      required: [id, source_account_id, destination_account_id, amount, description, reference_id, created_at, entries, duplicate]
      properties:
        id: { type: string, format: uuid }
        source_account_id: { type: string, format: uuid }
        destination_account_id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        description: { type: string }
        reference_id: { type: string }
        created_at: { type: string, format: date-time }
        entries:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        duplicate: { type: boolean }
    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: {} }
            request_id: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Account not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DomainError:
      description: Domain rule rejected the request, such as insufficient funds
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
